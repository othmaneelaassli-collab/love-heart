<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MARWA ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
    }

    #title {
      position: fixed;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff8fd8;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 5px;
      text-shadow:
        0 0 5px #ff4fc3,
        0 0 15px #ff4fc3,
        0 0 35px #ff1493;
      z-index: 10;
      white-space: nowrap;
    }

    #message {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 17px;
      letter-spacing: 3px;
      opacity: 0.8;
      text-shadow: 0 0 10px #ff1493;
      z-index: 10;
      white-space: nowrap;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

  <div id="title">MARWA ❤️</div>
  <div id="message">YOU ARE SPECIAL ✨</div>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>

    // ==============================
    // SCENE
    // ==============================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x000000);

    // ==============================
    // CAMERA
    // ==============================

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      2000
    );

    camera.position.z = 35;

    // ==============================
    // RENDERER
    // ==============================

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    document.body.appendChild(renderer.domElement);

    // ==============================
    // HEART GROUP
    // ==============================

    const heartGroup = new THREE.Group();

    scene.add(heartGroup);

    // ==============================
    // TEXTURE FOR "MARWA"
    // ==============================

    const canvas = document.createElement("canvas");

    canvas.width = 512;
    canvas.height = 128;

    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.font = "bold 70px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#ff8bdc";

    ctx.shadowColor = "#ff1493";
    ctx.shadowBlur = 25;

    ctx.fillText("MARWA", 256, 64);

    const texture = new THREE.CanvasTexture(canvas);

    texture.needsUpdate = true;

    // ==============================
    // SPRITE MATERIAL
    // ==============================

    const material = new THREE.SpriteMaterial({
      map: texture,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    // ==============================
    // HEART FUNCTION
    // ==============================

    function heartPoint(t, z) {

      const x =
        16 * Math.pow(Math.sin(t), 3);

      const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

      return {
        x: x * 0.65,
        y: y * 0.65,
        z: z
      };
    }

    // ==============================
    // CREATE MARWA TEXT
    // ==============================

    const particles = [];

    const layers = 18;
    const pointsPerLayer = 55;

    for (let layer = 0; layer < layers; layer++) {

      const z =
        (layer / (layers - 1) - 0.5) * 10;

      const scale =
        1 - Math.abs(z) * 0.035;

      for (let i = 0; i < pointsPerLayer; i++) {

        const t =
          (i / pointsPerLayer) * Math.PI * 2;

        const p = heartPoint(t, z);

        const sprite = new THREE.Sprite(material.clone());

        sprite.position.set(
          p.x * scale,
          p.y * scale,
          p.z
        );

        const size =
          0.55 + Math.random() * 0.35;

        sprite.scale.set(
          size * 2.7,
          size * 0.7,
          1
        );

        heartGroup.add(sprite);

        particles.push({
          sprite: sprite,

          original: new THREE.Vector3(
            p.x * scale,
            p.y * scale,
            p.z
          ),

          random:
            Math.random() * Math.PI * 2,

          speed:
            0.7 + Math.random() * 1.2
        });
      }
    }

    // ==============================
    // EXTRA GLOW PARTICLES
    // ==============================

    const glowGeometry =
      new THREE.BufferGeometry();

    const glowPositions = [];

    for (let i = 0; i < 500; i++) {

      const angle =
        Math.random() * Math.PI * 2;

      const radius =
        10 + Math.random() * 18;

      const x =
        Math.cos(angle) * radius;

      const y =
        Math.sin(angle) * radius;

      const z =
        (Math.random() - 0.5) * 18;

      glowPositions.push(x, y, z);
    }

    glowGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(
        glowPositions,
        3
      )
    );

    const glowMaterial =
      new THREE.PointsMaterial({
        color: 0xff1493,
        size: 0.08,
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending
      });

    const glowParticles =
      new THREE.Points(
        glowGeometry,
        glowMaterial
      );

    scene.add(glowParticles);

    // ==============================
    // HEART GLOW LIGHT
    // ==============================

    const pinkLight =
      new THREE.PointLight(
        0xff1493,
        15,
        80
      );

    pinkLight.position.set(
      0,
      0,
      10
    );

    scene.add(pinkLight);

    // ==============================
    // ANIMATION
    // ==============================

    const clock = new THREE.Clock();

    function animate() {

      requestAnimationFrame(animate);

      const time =
        clock.getElapsedTime();

      // --------------------------
      // HEART ROTATION
      // --------------------------

      heartGroup.rotation.y =
        time * 0.45;

      heartGroup.rotation.x =
        Math.sin(time * 0.45) * 0.12;

      heartGroup.rotation.z =
        Math.sin(time * 0.25) * 0.04;

      // --------------------------
      // INSIDE / OUTSIDE EFFECT
      // --------------------------

      particles.forEach((p, index) => {

        const wave =
          Math.sin(
            time * p.speed +
            p.random +
            index * 0.015
          );

        const expansion =
          1 + wave * 0.18;

        const breathing =
          1 +
          Math.sin(time * 1.8) * 0.04;

        p.sprite.position.x =
          p.original.x *
          expansion *
          breathing;

        p.sprite.position.y =
          p.original.y *
          expansion *
          breathing;

        p.sprite.position.z =
          p.original.z *
          expansion;

        // Slight floating movement
        p.sprite.position.y +=
          Math.sin(
            time * 2 +
            p.random
          ) * 0.08;

        // Glow animation
        const pulse =
          0.85 +
          Math.sin(
            time * 3 +
            p.random
          ) * 0.25;

        p.sprite.material.opacity =
          pulse;
      });

      // --------------------------
      // OUTER PARTICLES
      // --------------------------

      glowParticles.rotation.y =
        time * 0.05;

      glowParticles.rotation.x =
        Math.sin(time * 0.2) * 0.05;

      // --------------------------
      // LIGHT PULSE
      // --------------------------

      pinkLight.intensity =
        12 +
        Math.sin(time * 3) * 5;

      // --------------------------
      // CAMERA BREATHING
      // --------------------------

      camera.position.z =
        35 +
        Math.sin(time * 0.8) * 1.5;

      camera.lookAt(0, 0, 0);

      renderer.render(
        scene,
        camera
      );
    }

    animate();

    // ==============================
    // RESPONSIVE
    // ==============================

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
