<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Heart ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

.title {
    position: fixed;
    top: 25px;
    width: 100%;
    text-align: center;
    color: #ff9ed6;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow:
        0 0 5px #ff4db8,
        0 0 15px #ff1493,
        0 0 35px #ff1493;
    z-index: 10;
}
</style>

<!-- IMPORTANT -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
}
</script>

</head>

<body>

<div class="title">
    I LOVE YOU ❤️
</div>

<script type="module">

import * as THREE from "three";


// ========================================
// SCENE
// ========================================

const scene = new THREE.Scene();


// ========================================
// CAMERA
// ========================================

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.z = 30;


// ========================================
// RENDERER
// ========================================

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);


// ========================================
// HEART
// ========================================

const heart = new THREE.Group();

scene.add(heart);


// ========================================
// HEART FORMULA
// ========================================

function heartPoint(t) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x,
        y: y
    };
}


// ========================================
// CREATE TEXTURE
// ========================================

function createTextTexture(text) {

    const canvas =
        document.createElement("canvas");

    canvas.width = 512;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font =
        "bold 48px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    // Pink glow
    ctx.shadowColor =
        "#ff1493";

    ctx.shadowBlur =
        25;

    ctx.fillStyle =
        "#ff8fd0";

    ctx.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );

    return new THREE.CanvasTexture(
        canvas
    );
}


// ========================================
// MATERIAL
// ========================================

const texture =
    createTextTexture("I love you");

const material =
    new THREE.SpriteMaterial({

        map: texture,

        transparent: true,

        depthWrite: false,

        blending:
            THREE.AdditiveBlending
    });


// ========================================
// CREATE HEART TEXT
// ========================================

const amount = 350;

for (let i = 0; i < amount; i++) {

    const t =
        (i / amount) *
        Math.PI * 2;


    const p =
        heartPoint(t);


    const sprite =
        new THREE.Sprite(
            material.clone()
        );


    // 3D depth
    const z =
        (Math.random() - 0.5) * 8;


    sprite.position.set(

        p.x * 0.55 +
        (Math.random() - 0.5) * 0.5,

        p.y * 0.55 +
        (Math.random() - 0.5) * 0.5,

        z
    );


    const size =
        0.45 +
        Math.random() * 0.55;


    sprite.scale.set(
        2.2 * size,
        0.55 * size,
        1
    );


    sprite.userData = {

        baseX:
            sprite.position.x,

        baseY:
            sprite.position.y,

        baseZ:
            z,

        phase:
            Math.random() *
            Math.PI * 2,

        speed:
            0.5 +
            Math.random() * 1.5
    };


    heart.add(sprite);
}


// ========================================
// EXTRA GLOW PARTICLES
// ========================================

const particleGeometry =
    new THREE.BufferGeometry();

const particleCount = 800;

const positions =
    new Float32Array(
        particleCount * 3
    );


for (
    let i = 0;
    i < particleCount;
    i++
) {

    positions[i * 3] =
        (Math.random() - 0.5) * 35;

    positions[i * 3 + 1] =
        (Math.random() - 0.5) * 25;

    positions[i * 3 + 2] =
        (Math.random() - 0.5) * 20;
}


particleGeometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
        positions,
        3
    )
);


const particleMaterial =
    new THREE.PointsMaterial({

        color: 0xff1493,

        size: 0.08,

        transparent: true,

        opacity: 0.8,

        blending:
            THREE.AdditiveBlending
    });


const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

scene.add(particles);


// ========================================
// ANIMATION
// ========================================

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );

    const time =
        clock.getElapsedTime();


    // 3D rotation
    heart.rotation.y =
        time * 0.45;

    heart.rotation.x =
        Math.sin(time * 0.5) * 0.15;


    // Text movement
    heart.children.forEach(
        (sprite, i) => {

            const d =
                sprite.userData;


            // Inside → outside effect
            const wave =
                Math.sin(
                    time * d.speed +
                    d.phase
                );


            sprite.position.z =
                d.baseZ +
                wave * 1.5;


            // Floating
            sprite.position.y =
                d.baseY +
                Math.sin(
                    time * 1.5 +
                    d.phase
                ) * 0.08;
        }
    );


    // Particles
    particles.rotation.y =
        time * 0.03;


    particles.rotation.x =
        time * 0.01;


    // Camera breathing
    camera.position.z =
        30 +
        Math.sin(time * 0.8) * 1.5;


    camera.lookAt(
        0,
        0,
        0
    );


    renderer.render(
        scene,
        camera
    );
}


animate();


// ========================================
// RESPONSIVE
// ========================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
